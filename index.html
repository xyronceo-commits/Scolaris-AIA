
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scolaris AI - Study Smarter. Stress Less.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-deep: #020617;
        --indigo-glow: rgba(99, 102, 241, 0.15);
      }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-deep);
        color: #f8fafc;
        margin: 0;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .atmosphere {
        position: fixed;
        inset: 0;
        background: 
          radial-gradient(circle at 50% -20%, #312e81 0%, transparent 60%),
          radial-gradient(circle at -10% 100%, #1e1b4b 0%, transparent 50%),
          radial-gradient(circle at 110% 100%, #4c1d95 0%, transparent 50%);
        opacity: 0.5;
        filter: blur(100px);
        pointer-events: none;
        z-index: -1;
      }
      .glass {
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-card {
        background: rgba(30, 41, 59, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .glass-light {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .gradient-text {
        background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .gradient-bg {
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      }
      .shadow-glow {
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(99, 102, 241, 0.4);
      }
      .nav-dock-container {
        pointer-events: none;
      }
      .nav-dock-container > * {
        pointer-events: auto;
      }
      #root {
        height: 100vh;
        position: relative;
        z-index: 1;
      }

      /* Transitions */
      .page-transition {
        animation: pageFade 0.5s ease-out;
      }
      @keyframes pageFade {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",

    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>

</body>
</html>
