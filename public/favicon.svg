<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a58f0" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="2" />

  <!-- Graduation Mortarboard / Academic Mark -->
  <path d="M64 26 L104 46 L64 66 L24 46 Z" fill="#ffffff" />
  <path d="M40 54 L40 76 Q64 92 88 76 L88 54" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  
  <!-- Tassel -->
