  <circle cx="34" cy="85" r="3.5" fill="#38bdf8" />

  <!-- Neural Intelligence Nodes (IQ) -->
  <circle cx="64" cy="98" r="5" fill="#38bdf8" />
  <circle cx="48" cy="106" r="3.5" fill="#818cf8" />
  <circle cx="80" cy="106" r="3.5" fill="#818cf8" />
  <line x1="64" y1="98" x2="48" y2="106" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
  <line x1="64" y1="98" x2="80" y2="106" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
</svg>
